# ==============================
# Basic Configuration
# ==============================

set -g base-index 1           # Start windows numbering at 1
setw -g pane-base-index 1     # Make pane numbering consistent with windows
setw -g automatic-rename on   # Rename window to reflect current program
set -g renumber-windows on    # Renumber windows when one is closed
set -g set-titles on          # Set terminal title
set -g display-panes-time 800 # Pane indicators display time
set -g display-time 1000      # Status messages display time
set -g status-interval 2      # Redraw status line every 2 seconds
set -g mouse on               # Enable mouse support
set -g set-clipboard on       # Use system clipboard
set -g history-limit 1000000  # Increase history size
set -g detach-on-destroy off  # Keep sessions open when last pane is closed
set -g default-terminal "tmux-256color" # Ensure colors work properly

# ==============================
# Keybindings
# ==============================

# Change prefix to Ctrl+Space
# unbind C-Space
# unbind C-b
# set-option -g prefix C-Space
# bind-key C-Space send-prefix 

unbind r
bind r source-file "~/.config/tmux/tmux.conf" # Reload tmux config with Leader+R


# Window & Pane Management
bind | split-window -hc "#{pane_current_path}" # Split horizontally, keep cwd
bind - split-window -vc "#{pane_current_path}" # Split vertically, keep cwd
bind s split-window -hc "#{pane_current_path}" "nvim \"$(mktemp -t scratch)\"" # Scratch nvim pane (side-by-side)
bind c new-window -c '#{pane_current_path}'    # Open new window in cwd
bind g new-window -c '#{pane_current_path}' -n '' lazygit               # Open lazygit
bind G new-window -c '#{pane_current_path}' -n '' gh dash               # Open GitHub CLI dashboard
bind o run open-github                         # Open GitHub page for current repo
bind-key x kill-pane                           # Kill current pane

# Copy Mode & Selection (Vim-style)
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # Start selection with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection  # Copy selection with "y"

# Enter copy-mode with line numbers (Cmd+Y in Ghostty → Leader+[)
bind [ { copy-mode ; run-shell "~/.config/tmux/plugins/tmux-line-numbers/scripts/on-mode-changed.sh #{pane_id} 1" }
# Clean up line-number pane on copy-mode exit
set-hook -g pane-mode-changed "run-shell -b '[ #{pane_in_mode} -eq 0 ] && ~/.config/tmux/plugins/tmux-line-numbers/scripts/on-mode-changed.sh #{pane_id} 0 || true'"

# Movement in Copy Mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Session selector (sesh native picker)
#   ^o preview  ^u/^d half page  #<n> jump to row n  /<alias> alias mode
#   All sources are in the one list, so there is nothing to cycle. The list is
#   fetched once at open: reopen to see sessions started or killed since.
bind-key -N "session picker (via sesh) " "K" display-popup -h 90% -w 80% -E "sesh picker -i -H"
# Directory finder (the native picker's sources only cover known sessions)
bind-key -N "find dir (via sesh) " "F" run-shell "sesh-find-dir"
bind-key -N "jump to ai session" "C" run-shell ai-session-manager
# Worktree sessions for the current repo only (sesh's picker is unfiltered)
bind-key -N "jump to worktree session" "W" run-shell wt-sessions
bind -N "obsidian notes (via sesh) " N run-shell "sesh connect 'Obsidian'"
bind -N "last-session (via sesh) " l run-shell "sesh last"
bind -N "switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"

# ==============================
# Mouse & Navigation
# ==============================

set -g mouse on       # Enable mouse for selecting & resizing
setw -g mode-keys vi  # Use Vim-style navigation

# Status bar settings
set -g status-position top

# ==============================
# Status Bar & Themes
# ==============================

# Theme: joshmedeski
set -g status-left "#[fg=blue,bold]#S "
set -g status-right " #[fg=white,nobold]#(gitmux -cfg ~/.config/tmux/gitmux.yml)"
set -g status-left-length 200    # Increase left status length
set -g status-right-length 200   # Increase right status length
set -g status-style 'bg=default' # Transparent status bar
set -g window-status-current-format '#[fg=magenta]#I:#[fg=magenta]#W'
set -g window-status-format '#[fg=gray]#I:#[fg=gray]#W'

# ==============================
# Plugins & Extensions
# ==============================
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Tmux Continuum (Session Auto-Restore)
set -g @continuum-restore 'on'

# Tmux Thumbs (Smart Copy)
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-regexp-1 '[a-z0-9]+-[^ ]+'

# Tmux fzf-url (Open URLs with fzf)
# open tmux-fzf-url in a tmux v3.2+ popup
set -g @fzf-url-fzf-options '-w 50% -h 50% --multi -0 --no-preview --no-border'

# Plugin List
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# not loaded via TPM — triggered manually via Leader+[ only
# set -g @plugin 'JosephLai241/tmux-line-numbers'

# Uncomment to enable additional plugins:
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# ==============================
# Run TPM (Tmux Plugin Manager)
# ==============================
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
